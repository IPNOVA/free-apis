openapi: 3.1.0
info:
  title: VinDecoderCheck VIN Decoder API
  version: "1.0"
  description: >
    Free VIN decoder. Decode a Vehicle Identification Number into make, model,
    year, engine, plant and body facts, sourced from the NHTSA vPIC database
    (US public domain), with a link to the site's specs and recalls page for
    the exact model. No key required.
  contact:
    name: IPNOVA SYSTEMS LTD
    url: https://vindecodercheck.com/vin-api
    email: hello@ipnova.com
  license:
    name: Free to use, attribution appreciated
    url: https://vindecodercheck.com/vin-api
servers:
  - url: https://vindecodercheck.com
security:
  - {}
  - ApiKeyHeader: []
  - ApiKeyQuery: []
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Optional. A free api.ipnova.com key applies your plan allowance
        instead of the per-IP limits. A decode costs 3 credits.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Optional. Same effect as the X-Api-Key header, for clients that cannot set headers.
  headers:
    XCreditsRemaining:
      description: >
        Remaining monthly credits for the resolved key, or "unavailable" if
        the key service could not be reached. Present only on keyed requests.
      schema: { type: string }
    XCreditsUsed:
      description: Credits this request consumed (3 per decode). Present only on keyed requests.
      schema: { type: string }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: boolean, example: true }
        reason:
          type: string
          enum: [invalid_input, invalid_key, rate_limit, daily_limit, credits_exhausted, upstream_unavailable]
        message: { type: string }
        docs: { type: string, format: uri }
paths:
  /api/vin/{vin}:
    get:
      summary: Decode a Vehicle Identification Number
      operationId: decodeVin
      parameters:
        - name: vin
          in: path
          required: true
          description: >
            11 to 17 characters, case-insensitive. VINs never contain the
            letters I, O or Q.
          schema:
            type: string
            pattern: "^[A-HJ-NPR-Za-hj-npr-z0-9]{11,17}$"
            example: "1HGCM82633A004352"
      responses:
        "200":
          description: VIN decoded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  vin: { type: string, example: "1HGCM82633A004352" }
                  make: { type: string, example: "HONDA" }
                  model: { type: string, example: "Accord" }
                  model_year: { type: string, example: "2003" }
                  manufacturer: { type: string, example: "AMERICAN HONDA MOTOR CO., INC." }
                  plant_city: { type: string, example: "MARYSVILLE" }
                  plant_country: { type: string, example: "UNITED STATES (USA)" }
                  vehicle_type: { type: string, example: "PASSENGER CAR" }
                  body_class: { type: string, example: "Coupe" }
                  engine_cylinders: { type: string, example: "6" }
                  displacement_l: { type: string, example: "2.998832712" }
                  fuel_type_primary: { type: string, example: "Gasoline" }
                  transmission_style: { type: string, example: "Automatic" }
                  doors: { type: string, example: "2" }
                  g_v_w_r: { type: string, example: "Class 1C: 4,001 - 5,000 lb (1,814 - 2,268 kg)" }
                  trim: { type: string, example: "EX-V6" }
                  error_text: { type: string, example: "0 - VIN decoded clean. Check Digit (9th position) is correct" }
                  specs_page: { type: string, format: uri, example: "https://vindecodercheck.com/car/2003-honda-accord" }
                  recalls_on_record: { type: integer, example: 15 }
                  source: { type: string, example: "NHTSA vPIC (US public domain)" }
                  docs: { type: string, format: uri, example: "https://vindecodercheck.com/vin-api" }
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
        "400":
          description: "invalid_input: VIN is not 11 to 17 characters, or contains I, O or Q"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                tooShort:
                  summary: VIN outside the 11 to 17 character range
                  value:
                    success: false
                    error: true
                    reason: "invalid_input"
                    message: "Provide a VIN (17 characters; partial VINs of 11+ accepted)."
                    docs: "https://vindecodercheck.com/vin-api"
                bannedLetters:
                  summary: VIN contains I, O or Q
                  value:
                    success: false
                    error: true
                    reason: "invalid_input"
                    message: "VINs never contain the letters I, O or Q."
                    docs: "https://vindecodercheck.com/vin-api"
        "401":
          description: "invalid_key: the API key sent is malformed, unknown, revoked or expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "invalid_key"
                message: "This API key is unknown, revoked or expired. Check your keys at https://api.ipnova.com/keys."
                docs: "https://vindecodercheck.com/vin-api"
        "429":
          description: "rate_limit, daily_limit or credits_exhausted depending on which allowance ran out"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rateLimit:
                  summary: Per-minute cap hit (keyless, 20/minute per IP)
                  value:
                    success: false
                    error: true
                    reason: "rate_limit"
                    message: "Rate limit exceeded: 20 requests per minute."
                    docs: "https://vindecodercheck.com/vin-api"
                dailyLimit:
                  summary: Keyless daily cap hit (300/day per IP)
                  value:
                    success: false
                    error: true
                    reason: "daily_limit"
                    message: "Daily limit reached (300/day)."
                    docs: "https://vindecodercheck.com/vin-api"
                creditsExhausted:
                  summary: Keyed request out of monthly plan credits (a decode costs 3)
                  value:
                    success: false
                    error: true
                    reason: "credits_exhausted"
                    message: "Monthly credit allowance used up. Credits reset on the first of next month."
                    docs: "https://vindecodercheck.com/vin-api"
        "502":
          description: "upstream_unavailable: the NHTSA vPIC decoder did not answer, only on an uncached VIN's first decode"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "upstream_unavailable"
                message: "Upstream decoder unavailable, try again shortly."
                docs: "https://vindecodercheck.com/vin-api"
