openapi: 3.1.0
info:
  title: SwiftCodeCheck SWIFT/BIC Lookup API
  version: "1.0"
  description: >
    Free SWIFT/BIC lookup. Identify the bank, branch, city, country and ISO
    9362 code breakdown behind any SWIFT/BIC code. No key required.
  contact:
    name: IPNOVA SYSTEMS LTD
    url: https://swiftcodecheck.com/swift-code-api
    email: hello@ipnova.com
  license:
    name: Free to use, attribution appreciated
    url: https://swiftcodecheck.com/swift-code-api
servers:
  - url: https://swiftcodecheck.com
security:
  - {}
  - ApiKeyHeader: []
  - ApiKeyQuery: []
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Optional. A free api.ipnova.com key applies your plan allowance instead of the per-IP limits.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Optional. Same effect as the X-Api-Key header, for clients that cannot set headers.
  headers:
    XCreditsRemaining:
      description: >
        Remaining monthly credits for the resolved key, or "unavailable" if
        the key service could not be reached. Present only on keyed requests.
      schema: { type: string }
    XCreditsUsed:
      description: Credits this request consumed (1). Present only on keyed requests.
      schema: { type: string }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: boolean, example: true }
        reason:
          type: string
          enum: [invalid_input, invalid_key, not_found, method_not_allowed, payload_too_large, rate_limit, daily_limit, credits_exhausted]
        message: { type: string }
        docs: { type: string, format: uri }
paths:
  /api/swift/{code}:
    get:
      summary: Look up a SWIFT / BIC code
      operationId: lookupSwiftCode
      parameters:
        - name: code
          in: path
          required: true
          description: >
            An 8 or 11-character SWIFT/BIC code. Case-insensitive; spaces and
            dashes are stripped before validation.
          schema:
            type: string
            pattern: "^[A-Za-z]{4}[A-Za-z]{2}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$"
            example: "DEUTDEFF"
      responses:
        "200":
          description: SWIFT/BIC code found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      swift_code: { type: string, example: "DEUTDEFF" }
                      bank: { type: string, example: "Deutsche Bank AG" }
                      city: { type: string, example: "Frankfurt Am Main" }
                      branch: { type: string, example: "" }
                      country_code: { type: string, example: "DE" }
                      country: { type: string, example: "Germany" }
                      bank_code: { type: string, example: "DEUT" }
                      location_code: { type: string, example: "FF" }
                      branch_code: { type: string, example: "XXX" }
                      head_office: { type: boolean, example: true }
                  page: { type: string, format: uri }
                  attribution: { type: string }
                  docs: { type: string, format: uri }
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
        "400":
          description: "invalid_input: input is not a valid 8 or 11-character SWIFT/BIC format"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "invalid_input"
                message: "Provide a valid 8 or 11-character SWIFT/BIC code."
                docs: "https://swiftcodecheck.com/swift-code-api"
        "401":
          description: "invalid_key: the API key sent is malformed, unknown, revoked or expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "invalid_key"
                message: "This API key is unknown, revoked or expired. Check your keys at https://api.ipnova.com/keys."
                docs: "https://swiftcodecheck.com/swift-code-api"
        "404":
          description: "not_found: code has a valid format but is not in the public dataset"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "not_found"
                message: "SWIFT code not found in the public dataset. The format is valid - verify the code with the bank."
                docs: "https://swiftcodecheck.com/swift-code-api"
                code: "ZZZZUS00XXX"
                valid_format: true
        "429":
          description: "rate_limit, daily_limit or credits_exhausted depending on which allowance ran out"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rateLimit:
                  summary: Per-minute cap hit (keyless, 30/minute per IP)
                  value:
                    success: false
                    error: true
                    reason: "rate_limit"
                    message: "Too many requests. Please slow down and try again in a minute."
                    docs: "https://swiftcodecheck.com/swift-code-api"
                dailyLimit:
                  summary: Keyless daily cap hit (100/day per IP)
                  value:
                    success: false
                    error: true
                    reason: "daily_limit"
                    message: "Daily API limit reached (100 requests/day per IP). Resets at midnight UTC."
                    docs: "https://swiftcodecheck.com/swift-code-api"
                creditsExhausted:
                  summary: Keyed request out of monthly plan credits
                  value:
                    success: false
                    error: true
                    reason: "credits_exhausted"
                    message: "Monthly credit allowance used up. Credits reset on the first of next month."
                    docs: "https://swiftcodecheck.com/swift-code-api"
  /api/swift-batch:
    post:
      summary: Look up up to 100 SWIFT / BIC codes in one call
      description: "One credit per ten codes, rounded up, counted against the per-IP daily limit the same way. Codes are normalised and de-duplicated. Malformed items come back as rows with valid_format false. Responses are sent with Cache-Control no-store."
      operationId: lookupSwiftBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                  example: ["DEUTDEFF", "CHASUS33"]
      responses:
        "200":
          description: Batch results, one entry per distinct code
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer, example: 2 }
                  found: { type: integer, example: 2 }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: "DEUTDEFF" }
                        found: { type: boolean }
                        valid_format: { type: boolean }
                        error: { type: string, example: "invalid format", description: "Present on rows whose code is malformed" }
                        swift_code: { type: string, example: "DEUTDEFF" }
                        bank: { type: string, example: "Deutsche Bank AG" }
                        city: { type: string, example: "Frankfurt Am Main" }
                        branch: { type: string }
                        country_code: { type: string, example: "DE" }
                        country: { type: string, example: "Germany" }
                        bank_code: { type: string, example: "DEUT" }
                        location_code: { type: string, example: "FF" }
                        branch_code: { type: string, example: "XXX" }
                        head_office: { type: boolean }
                  attribution: { type: string }
                  docs: { type: string, format: uri }
        "400":
          description: "invalid_input: codes missing, empty, not an array, or over 100 items"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "invalid_key: the API key is malformed, unknown, revoked or expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405":
          description: "method_not_allowed: method is not POST"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "payload_too_large: request body over 64 KB"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "rate_limit (30/minute per IP), daily_limit (100/day per IP, batch calls cost ceil(n/10)) or credits_exhausted"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
