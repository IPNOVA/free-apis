openapi: 3.1.0
info:
  title: AirportCodeCheck Airport Code & Routes API
  version: "1.0"
  description: >
    Free airport lookup by IATA or ICAO code, direct-flight destinations,
    nonstop or best one-stop connections between two airports, name/city
    search, and countries with airport counts. No key required.
  contact:
    name: IPNOVA SYSTEMS LTD
    url: https://airportcodecheck.com/airport-api
    email: hello@ipnova.com
  license:
    name: Free to use, attribution appreciated
    url: https://airportcodecheck.com/airport-api
servers:
  - url: https://airportcodecheck.com
security:
  - {}
  - ApiKeyHeader: []
  - ApiKeyQuery: []
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Optional. A free api.ipnova.com key applies your plan allowance instead of the per-IP limits.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Optional. Same effect as the X-Api-Key header, for clients that cannot set headers.
  headers:
    XCreditsRemaining:
      description: >
        Remaining monthly credits for the resolved key, or "unavailable" if
        the key service could not be reached. Present only on keyed requests.
      schema: { type: string }
    XCreditsUsed:
      description: Credits this request consumed (1). Present only on keyed requests.
      schema: { type: string }
  responses:
    InvalidKey:
      description: "invalid_key: the API key sent is malformed, unknown, revoked or expired"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            success: false
            error: true
            reason: "invalid_key"
            message: "This API key is unknown, revoked or expired. Check your keys at https://api.ipnova.com/keys."
            docs: "https://airportcodecheck.com/airport-api"
    RateLimited:
      description: "rate_limit, daily_limit or credits_exhausted depending on which allowance ran out"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            rateLimit:
              summary: Per-minute cap hit (keyless, 30/minute per IP)
              value:
                success: false
                error: true
                reason: "rate_limit"
                message: "Rate limit exceeded: max 30 requests per minute."
                docs: "https://airportcodecheck.com/airport-api"
            dailyLimit:
              summary: Keyless daily cap hit (500/day per IP)
              value:
                success: false
                error: true
                reason: "daily_limit"
                message: "Daily limit reached (500 requests). Resets at midnight UTC."
                docs: "https://airportcodecheck.com/airport-api"
            creditsExhausted:
              summary: Keyed request out of monthly plan credits
              value:
                success: false
                error: true
                reason: "credits_exhausted"
                message: "Monthly credit allowance used up. Credits reset on the first of next month."
                docs: "https://airportcodecheck.com/airport-api"
  parameters:
    code:
      name: code
      in: path
      required: true
      description: IATA or ICAO airport code
      schema: { type: string, pattern: "^[A-Za-z0-9-]{2,12}$", example: "FNC" }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: boolean, example: true }
        reason:
          type: string
          enum: [invalid_input, invalid_key, not_found, rate_limit, daily_limit, credits_exhausted]
        message: { type: string }
        docs: { type: string, format: uri }
    Airport:
      type: object
      properties:
        slug: { type: string, example: "fnc" }
        name: { type: string, example: "Cristiano Ronaldo International Airport" }
        city: { type: string, example: "Funchal" }
        country: { type: string, example: "PT" }
        country_name: { type: string, example: "Portugal" }
        iata: { type: string, nullable: true, example: "FNC" }
        icao: { type: string, example: "LPMA" }
        type: { type: string, example: "large_airport" }
        scheduled_service: { type: boolean, example: true }
        lat: { type: number, example: 32.69781 }
        lon: { type: number, example: -16.77461 }
        elevation_ft: { type: integer, example: 192 }
        url: { type: string, format: uri, example: "https://airportcodecheck.com/airport/fnc" }
paths:
  /api/airport/{code}:
    get:
      summary: Look up an airport by IATA or ICAO code
      operationId: lookupAirport
      parameters:
        - $ref: "#/components/parameters/code"
      responses:
        "200":
          description: Airport found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  airport: { $ref: "#/components/schemas/Airport" }
                  source: { type: string }
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
        "404":
          description: "not_found: no airport found for that code"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "not_found"
                message: "No airport found for \"ZZZ\"."
                docs: "https://airportcodecheck.com/airport-api"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/routes/{code}:
    get:
      summary: List direct-flight destinations from an airport
      operationId: lookupRoutes
      parameters:
        - $ref: "#/components/parameters/code"
      responses:
        "200":
          description: Airport and its nonstop destinations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  airport: { $ref: "#/components/schemas/Airport" }
                  destinations:
                    type: array
                    items:
                      type: object
                      properties:
                        iata: { type: string, nullable: true, example: "RIX" }
                        icao: { type: string, example: "EVRA" }
                        name: { type: string, example: "Riga International Airport" }
                        city: { type: string, example: "Riga" }
                        country: { type: string, example: "LV" }
                        airlines:
                          type: array
                          items: { type: string }
                          example: ["airBaltic"]
                        seasonal: { type: boolean, example: false }
                        distance_km: { type: integer, example: 4093 }
                        url: { type: string, format: uri, example: "https://airportcodecheck.com/flights/fnc-to-rix" }
                  refreshed: { type: string, format: date-time, nullable: true, example: "2026-09-09T06:43:14+00:00" }
                  source: { type: string }
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
        "404":
          description: "not_found: no airport found for that code"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "not_found"
                message: "No airport found for \"ZZZ\"."
                docs: "https://airportcodecheck.com/airport-api"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/connections/{from}/{to}:
    get:
      summary: Nonstop route or best one-stop options between two airports
      operationId: lookupConnections
      parameters:
        - name: from
          in: path
          required: true
          description: Origin IATA or ICAO airport code
          schema: { type: string, pattern: "^[A-Za-z0-9-]{2,12}$", example: "FNC" }
        - name: to
          in: path
          required: true
          description: Destination IATA or ICAO airport code
          schema: { type: string, pattern: "^[A-Za-z0-9-]{2,12}$", example: "JFK" }
      responses:
        "200":
          description: Distance, nonstop service if any, and one-stop options
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  from: { $ref: "#/components/schemas/Airport" }
                  to: { $ref: "#/components/schemas/Airport" }
                  distance_km: { type: integer, example: 5071 }
                  nonstop:
                    type: object
                    nullable: true
                    properties:
                      airlines:
                        type: array
                        items: { type: string }
                      seasonal: { type: boolean }
                      url: { type: string, format: uri }
                  one_stop:
                    type: array
                    description: Up to 8 one-stop options, ranked by total distance, present only when nonstop is null
                    items:
                      type: object
                      properties:
                        via:
                          type: object
                          properties:
                            iata: { type: string, nullable: true, example: "PDL" }
                            icao: { type: string, example: "LPPD" }
                            name: { type: string, example: "João Paulo II Airport" }
                            city: { type: string, example: "Ponta Delgada" }
                            country: { type: string, example: "PT" }
                        leg1_airlines:
                          type: array
                          items: { type: string }
                          example: ["Azores Airlines"]
                        leg1_seasonal: { type: boolean, example: false }
                        leg2_airlines:
                          type: array
                          items: { type: string }
                          example: ["Azores Airlines"]
                        leg2_seasonal: { type: boolean, example: false }
                        total_km: { type: integer, example: 5090 }
                        detour_km: { type: integer, example: 19 }
                  source: { type: string }
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
        "404":
          description: "not_found: unknown origin or destination airport code"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "not_found"
                message: "Unknown origin or destination airport code."
                docs: "https://airportcodecheck.com/airport-api"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/search:
    get:
      summary: Search airports by name, city or IATA code
      operationId: searchAirports
      parameters:
        - name: q
          in: query
          required: true
          description: 2 or more characters
          schema: { type: string, minLength: 2, example: "funchal" }
      responses:
        "200":
          description: Up to 8 matching airports
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  airports:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string, example: "fnc" }
                        name: { type: string, example: "Cristiano Ronaldo International Airport" }
                        city: { type: string, example: "Funchal" }
                        country:
                          type: string
                          description: Full country name (not the ISO code, unlike other endpoints)
                          example: "Portugal"
                        iata: { type: string, nullable: true, example: "FNC" }
                  source: { type: string }
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
        "400":
          description: "invalid_input: query shorter than 2 characters"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "invalid_input"
                message: "Provide at least 2 characters in q."
                docs: "https://airportcodecheck.com/airport-api"
        "401":
          $ref: "#/components/responses/InvalidKey"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/countries:
    get:
      summary: Countries with airport counts
      operationId: listCountries
      responses:
        "200":
          description: All countries with airport and IATA-airport counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        country: { type: string, example: "PT" }
                        name: { type: string, example: "Portugal" }
                        airports: { type: integer, example: 34 }
                        iata_airports: { type: integer, example: 12 }
                  source: { type: string }
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
        "401":
          $ref: "#/components/responses/InvalidKey"
        "429":
          $ref: "#/components/responses/RateLimited"
