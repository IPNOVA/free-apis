openapi: 3.1.0
info:
  title: EmailDomainCheck Disposable Email Domain API
  version: "1.0"
  description: >
    Free disposable email domain check. Two-tier verdict (confirmed / reported /
    no) against 4 community blocklists, plus a free-provider flag. Domain-only:
    send the domain, never the address. No key required.
  contact:
    name: IPNOVA SYSTEMS LTD
    url: https://emaildomaincheck.com/email-api
    email: hello@ipnova.com
  license:
    name: Free to use, attribution appreciated
    url: https://emaildomaincheck.com/email-api
servers:
  - url: https://emaildomaincheck.com
security:
  - {}
  - ApiKeyHeader: []
  - ApiKeyQuery: []
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Optional. A free api.ipnova.com key applies your plan allowance instead of the per-IP limits.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Optional. Same effect as the X-Api-Key header, for clients that cannot set headers.
  headers:
    XCreditsRemaining:
      description: >
        Remaining monthly credits for the resolved key, or "unavailable" if
        the key service could not be reached. Present only on keyed requests.
      schema: { type: string }
    XCreditsUsed:
      description: Credits this request consumed (1). Present only on keyed requests.
      schema: { type: string }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: boolean, example: true }
        reason:
          type: string
          enum: [invalid_input, invalid_key, rate_limit, daily_limit, credits_exhausted]
        message: { type: string }
        docs: { type: string, format: uri }
paths:
  /api/email-domain/{domain}:
    get:
      summary: Check a domain against the disposable and free-provider lists
      operationId: checkEmailDomain
      parameters:
        - name: domain
          in: path
          required: true
          description: >
            A domain name, not a full address. If a full address is sent
            anyway, only the part after @ is used and nothing is stored.
            Matched case-insensitively.
          schema:
            type: string
            pattern: "^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,24}$"
            example: "mailinator.com"
      responses:
        "200":
          description: Verdict for the domain
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  domain:
                    type: string
                    example: "mailinator.com"
                  disposable:
                    type: string
                    enum: [confirmed, reported, no]
                    description: >
                      confirmed = vetted list or 2 or more sources agree,
                      reported = a single list only (soft-verify, don't
                      hard-block), no = not on any tracked list
                    example: "confirmed"
                  matched_domain:
                    type: string
                    nullable: true
                    description: >
                      The listed domain that matched, equal to the parent when
                      a subdomain of a listed service is queried
                    example: "mailinator.com"
                  blocklists:
                    type: array
                    items:
                      type: string
                    description: Names of the community lists carrying the domain
                    example: ["disposable-email-domains blocklist", "disposable/disposable daily aggregate", "FGRibreau/mailchecker"]
                  blocklists_tracked:
                    type: integer
                    example: 4
                  free_provider:
                    type: boolean
                    description: True for personal-mailbox providers like gmail.com
                    example: false
                  first_seen:
                    type: string
                    format: date
                    nullable: true
                    description: Date the domain entered the dataset; null for long-established entries
                    example: null
                  mx_active:
                    type: boolean
                    nullable: true
                    description: Our own rolling DNS sample; null when not yet sampled
                    example: null
                  checked_at:
                    type: string
                    format: date-time
                    example: "2026-09-16T05:58:20+00:00"
                  docs:
                    type: string
                    format: uri
                    example: "https://emaildomaincheck.com/email-api"
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
        "400":
          description: "invalid_input: missing domain in the request, or the domain is not a syntactically valid hostname"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                missing:
                  summary: No domain in the request
                  value:
                    success: false
                    error: true
                    reason: "invalid_input"
                    message: "Missing domain. Usage: GET /api/email-domain/{domain}"
                    docs: "https://emaildomaincheck.com/email-api"
                notADomain:
                  summary: Domain is not a syntactically valid hostname
                  value:
                    success: false
                    error: true
                    reason: "invalid_input"
                    message: "Not a valid domain."
                    docs: "https://emaildomaincheck.com/email-api"
        "401":
          description: "invalid_key: the API key sent is malformed, unknown, revoked or expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "invalid_key"
                message: "This API key is unknown, revoked or expired. Check your keys at https://api.ipnova.com/keys."
                docs: "https://emaildomaincheck.com/email-api"
        "429":
          description: "rate_limit, daily_limit or credits_exhausted depending on which allowance ran out"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rateLimit:
                  summary: Per-minute cap hit (keyless, 30/minute per IP)
                  value:
                    success: false
                    error: true
                    reason: "rate_limit"
                    message: "Rate limit exceeded: 30 requests per minute. For bulk needs use the downloadable list at https://emaildomaincheck.com/disposable-email-domains"
                    docs: "https://emaildomaincheck.com/email-api"
                dailyLimit:
                  summary: Keyless daily cap hit (500/day per IP)
                  value:
                    success: false
                    error: true
                    reason: "daily_limit"
                    message: "Daily limit reached (500/day per IP). The full list is freely downloadable at https://emaildomaincheck.com/disposable-email-domains"
                    docs: "https://emaildomaincheck.com/email-api"
                creditsExhausted:
                  summary: Keyed request out of monthly plan credits
                  value:
                    success: false
                    error: true
                    reason: "credits_exhausted"
                    message: "Monthly credit allowance used up. Credits reset on the first of next month."
                    docs: "https://emaildomaincheck.com/email-api"
