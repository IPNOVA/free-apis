openapi: 3.1.0
info:
  title: IbanCodeCheck IBAN Validation API
  version: "1.0"
  description: >
    Free IBAN validation. Checks the country code and length against the ISO
    13616 registry and verifies the ISO 7064 mod-97 checksum, returning the
    domestic bank code where the registry defines its position. No key
    required. Algorithmic only: nothing is proxied, and IBANs are never
    stored or logged.
  contact:
    name: IPNOVA SYSTEMS LTD
    url: https://ibancodecheck.com/iban-api
    email: hello@ipnova.com
  license:
    name: Free to use, attribution appreciated
    url: https://ibancodecheck.com/iban-api
servers:
  - url: https://ibancodecheck.com
security:
  - {}
  - ApiKeyHeader: []
  - ApiKeyQuery: []
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Optional. A free api.ipnova.com key applies your plan allowance instead of the per-IP limits.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Optional. Same effect as the X-Api-Key header, for clients that cannot set headers.
  headers:
    XCreditsRemaining:
      description: >
        Remaining monthly credits for the resolved key, or "unavailable" if
        the key service could not be reached. Present only on keyed requests.
      schema: { type: string }
    XCreditsUsed:
      description: Credits this request consumed (1). Present only on keyed requests.
      schema: { type: string }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: boolean, example: true }
        reason:
          type: string
          enum: [invalid_input, invalid_key, rate_limit, daily_limit, credits_exhausted]
        message: { type: string }
        docs: { type: string, format: uri }
paths:
  /api/iban/{iban}:
    get:
      summary: Validate an IBAN
      operationId: validateIban
      parameters:
        - name: iban
          in: path
          required: true
          description: >
            An IBAN, letters and digits only in the URL; strip spaces and
            dashes before calling. Normalized to 5 to 34 uppercase
            alphanumeric characters before validation.
          schema:
            type: string
            pattern: "^[A-Za-z0-9]{5,34}$"
            example: "DE89370400440532013000"
      responses:
        "200":
          description: >
            Validation result. Returned even for a structurally wrong IBAN,
            with valid set to false and error explaining why.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      iban: { type: string, example: "DE89370400440532013000" }
                      formatted: { type: string, example: "DE89 3704 0044 0532 0130 00" }
                      valid: { type: boolean, example: true }
                      country_code: { type: string, example: "DE" }
                      country: { type: string, example: "Germany" }
                      sepa: { type: boolean, example: true }
                      length_ok: { type: boolean, example: true }
                      checksum_ok: { type: boolean, example: true }
                      check_digits: { type: string, example: "89" }
                      bank_code: { type: string, example: "37040044" }
                      error: { type: string, nullable: true, example: null }
                  page: { type: string, format: uri }
                  attribution: { type: string }
                  docs: { type: string, format: uri }
              example:
                success: true
                data:
                  iban: "DE89370400440532013000"
                  formatted: "DE89 3704 0044 0532 0130 00"
                  valid: true
                  country_code: "DE"
                  country: "Germany"
                  sepa: true
                  length_ok: true
                  checksum_ok: true
                  check_digits: "89"
                  bank_code: "37040044"
                  error: null
                page: "https://ibancodecheck.com/iban-format/DE"
                attribution: "Validation by IbanCodeCheck.com - free IBAN checker API. IBANs are never stored or logged."
                docs: "https://ibancodecheck.com/iban-api"
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/XCreditsRemaining" }
            X-Credits-Used: { $ref: "#/components/headers/XCreditsUsed" }
        "400":
          description: >
            invalid_input: input is not 5 to 34 characters once normalized
            (the URL path only accepts letters and digits, so a dashed or
            spaced IBAN 404s at the route level instead)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "invalid_input"
                message: "Provide an IBAN of 5 to 34 characters: /api/iban/DE89370400440532013000"
                docs: "https://ibancodecheck.com/iban-api"
        "401":
          description: "invalid_key: the API key sent is malformed, unknown, revoked or expired"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                success: false
                error: true
                reason: "invalid_key"
                message: "This API key is unknown, revoked or expired. Check your keys at https://api.ipnova.com/keys."
                docs: "https://ibancodecheck.com/iban-api"
        "429":
          description: "rate_limit, daily_limit or credits_exhausted depending on which allowance ran out"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rateLimit:
                  summary: Per-minute cap hit (keyless, 30/minute per IP)
                  value:
                    success: false
                    error: true
                    reason: "rate_limit"
                    message: "Too many requests. Please slow down and try again in a minute."
                    docs: "https://ibancodecheck.com/iban-api"
                dailyLimit:
                  summary: Keyless daily cap hit (500/day per IP)
                  value:
                    success: false
                    error: true
                    reason: "daily_limit"
                    message: "Daily API limit reached (500 requests/day per IP). Resets at midnight UTC."
                    docs: "https://ibancodecheck.com/iban-api"
                creditsExhausted:
                  summary: Keyed request out of monthly plan credits
                  value:
                    success: false
                    error: true
                    reason: "credits_exhausted"
                    message: "Monthly credit allowance used up. Credits reset on the first of next month."
                    docs: "https://ibancodecheck.com/iban-api"
